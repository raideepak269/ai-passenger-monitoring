[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airport-ai-person-detection"
version = "0.1.0"
description = "Production-ready webcam person detection, tracking, and behavior analysis with OpenCV and YOLOv8."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "deep-sort-realtime>=1.3,<2.0",
  "flask>=3.0,<4.0",
  "opencv-python>=4.13,<5.0",
  "ultralytics>=8.4,<9.0",
  "waitress>=3.0,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
]

[project.scripts]
person-detect-dashboard = "person_detection.dashboard:main"
person-detect-webcam = "person_detection.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
